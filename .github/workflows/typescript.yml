# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and compile it to typescript
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: TypeScript compilation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 19.x, 20.x, 21.x, 22.x, 23.x, 24.x, 25.x, 26.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v3
        with:
          version: 12.16.1
          runtime: "node@${{ matrix.node-version }}"

      - name: Install dependencies
        run: pnpm install

      - name: Typescript compiler
        uses: iCrawl/action-tsc@v1
